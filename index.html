<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>糸魚川海天気ビューア</title>
    <!-- 地図の見た目を読み込み（最も遮断されにくい標準URLに変更） -->
    <link rel="stylesheet" href="https://jsdelivr.net" />
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #222; }
        #map { width: 100%; height: 70vh; background: #333; }
        #controls { height: 30vh; background: #111; color: #fff; padding: 15px; box-sizing: border-box; text-align: center; }
        #time-display { font-size: 1.2rem; margin-bottom: 8px; font-weight: bold; color: #00ffcc; min-height: 24px; }
        #seekbar { width: 90%; height: 30px; margin: 10px 0; }
        .btn-group { display: flex; justify-content: center; gap: 20px; margin-top: 10px; }
        button { padding: 15px 35px; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; }
        #play-btn { background: #28a745; }
        #pause-btn { background: #dc3545; }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="controls">
        <div id="time-display">システム起動中...</div>
        <input type="range" id="seekbar" min="0" max="47" value="0">
        <div class="btn-group">
            <button id="play-btn">再生</button>
            <button id="pause-btn">停止</button>
        </div>
    </div>

    <!-- スマホのセキュリティブロックを確実に回避するため、Google等も使う世界最大手の超安定サーバー（jsdelivr）に変更 -->
    <script src="https://jsdelivr.net"></script>
    <script>
        // エラー検知の仕組み
        window.onerror = function(msg, url, line) {
            document.getElementById('time-display').innerText = "エラー発生: " + msg + " (L" + line + ")";
            return false;
        };

        // 地図プログラムの読み込みを少しだけ待ってから確実に実行する安全装置
        window.onload = function() {
            setTimeout(startSystem, 500);
        };

        function startSystem() {
            if (typeof L === 'undefined') {
                document.getElementById('time-display').innerText = "地図プログラムの読み込みが通信ブロックされています。Wi-Fiを切るかシークレットタブで開いてください。";
                return;
            }

            try {
                // 1. 地図の初期化（糸魚川沖）
                const map = L.map('map', { zoomControl: false }).setView([37.22, 137.86], 10);
                L.control.zoom({ position: 'bottomright' }).addTo(map);

                // 2. 背景地図を国土地理院（日本政府の公式サーバー）に変更してブロックを完全回避
                L.tileLayer('https://gsi.go.jp{z}/{x}/{y}.png', {
                    attribution: '国土地理院'
                }).addTo(map);

                let marineData = null;
                let dataLayers = L.layerGroup().addTo(map);
                let timer = null;

                // 3. データの読み込み
                const jsonPath = './marine_data.json?nocache=' + new Date().getTime();

                fetch(jsonPath)
                    .then(res => {
                        if (!res.ok) throw new Error('データが見つかりません(status:' + res.status + ')');
                        return res.json();
                    })
                    .then(data => {
                        if (data && data.hourly && data.hourly.time) {
                            marineData = data;
                            updateMap(0); // 成功したら最初の時間を表示
                        } else {
                            document.getElementById('time-display').innerText = "データの形が違います";
                        }
                    })
                    .catch(err => {
                        document.getElementById('time-display').innerText = "データ読み込み失敗: " + err.message;
                    });

                // 4. 画面更新
                function updateMap(index) {
                    if (!marineData) return;
                    dataLayers.clearLayers();

                    const hourly = marineData.hourly;
                    const timeStr = hourly.time[index];
                    
                    const dateObj = new Date(timeStr);
                    const formattedTime = `${dateObj.getMonth()+1}/${dateObj.getDate()} ${String(dateObj.getHours()).padStart(2, '0')}:00`;
                    document.getElementById('time-display').innerText = `予測日時: ${formattedTime}`;

                    const lat = 37.22;
                    const lon = 137.86;
                    const waveHeight = hourly.wave_height[index];

                    let color = '#007bff';
                    if (waveHeight > 2.0) color = '#ff3333';
                    else if (waveHeight > 1.0) color = '#ff9900';

                    const marker = L.circleMarker([lat, lon], {
                        radius: 25 + (waveHeight * 8),
                        color: color,
                        fillColor: color,
                        fillOpacity: 0.6,
                        weight: 2
                    }).addTo(dataLayers);

                    marker.bindPopup(`<b>糸魚川沖</b><br>波高: ${waveHeight}m`).openPopup();
                }

                // 5. シークバーの連動
                const seekbar = document.getElementById('seekbar');
                seekbar.addEventListener('input', (e) => {
                    updateMap(parseInt(e.target.value));
                });

                // 6. 再生・停止ボタンの連動
                document.getElementById('play-btn').addEventListener('click', () => {
                    if (timer) return;
                    timer = setInterval(() => {
                        let current = parseInt(seekbar.value);
                        current = (current + 1) % 48;
                        seekbar.value = current;
                        updateMap(current);
                    }, 800);
                });

                document.getElementById('pause-btn').addEventListener('click', () => {
                    clearInterval(timer);
                    timer = null;
                });

            } catch (e) {
                document.getElementById('time-display').innerText = "システムエラー: " + e.message;
            }
        }
    </script>
</body>
</html>
