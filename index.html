<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>糸魚川海天気ビューア</title>
    <style>
        /* 外部CSSがブロックされるため、地図に必要な最低限の見た目をここに直接埋め込み */
        .leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-map-pane svg,.leaflet-map-pane canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}.leaflet-container{overflow:hidden;-ms-touch-action:none;touch-action:none;cursor:-webkit-grab;cursor:-moz-grab;cursor:grab}.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-user-drag:none}.leaflet-tile{filter:inherit;visibility:hidden}.leaflet-tile-loaded{visibility:inherit}.leaflet-zoom-box{width:0;height:0;-moz-box-sizing:border-box;box-sizing:border-box;z-index:800}.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}.leaflet-map-pane svg{z-index:200}.leaflet-map-pane canvas{z-index:100}.leaflet-vml-shape{width:1px;height:1px}.lvml{behavior:url(#default#VML);display:inline-block;position:absolute}.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}.leaflet-top{position:absolute;z-index:1000;pointer-events:none;top:0}.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none;bottom:0}.leaflet-right{right:0}.leaflet-left{left:0}.leaflet-popup{position:absolute;text-align:center;bottom:0;cursor:default}.leaflet-popup-content-wrapper{padding:1px;text-align:left;border-radius:12px;background:white;color:#333;box-shadow:0 3px 14px rgba(0,0,0,0.4)}.leaflet-popup-content{margin:13px 19px;line-height:1.4;font-size:13px;min-width:50px}.leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-left:-20px;overflow:hidden;pointer-events:none}.leaflet-popup-tip{width:17px;height:17px;padding:1px;margin:-10px auto 0;transform:rotate(45deg);background:white;box-shadow:0 3px 14px rgba(0,0,0,0.4)}
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #222; }
        #map { width: 100%; height: 70vh; background: #333; }
        #controls { height: 30vh; background: #111; color: #fff; padding: 15px; box-sizing: border-box; text-align: center; }
        #time-display { font-size: 1.2rem; margin-bottom: 8px; font-weight: bold; color: #00ffcc; min-height: 24px; }
        #seekbar { width: 90%; height: 30px; margin: 10px 0; }
        .btn-group { display: flex; justify-content: center; gap: 20px; margin-top: 10px; }
        button { padding: 15px 35px; font-size: 1.1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; color: white; }
        #play-btn { background: #28a745; }
        #pause-btn { background: #dc3545; }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="controls">
        <div id="time-display">システム起動中...</div>
        <input type="range" id="seekbar" min="0" max="47" value="0">
        <div class="btn-group">
            <button id="play-btn">再生</button>
            <button id="pause-btn">停止</button>
        </div>
    </div>
