name: 1時間おきのデータ自動更新

on:
  schedule:
    - cron: '0 * * * *' # 毎時0分に自動実行
  workflow_dispatch: # 手動でいつでも動かせるボタンをつける

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions: write-all # ◀ これを追加して強制的に書き込み権限を許可します
    steps:
    - name: コードをチェックアウト
      uses: actions/checkout@v4

    - name: Pythonの準備
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: ライブラリのインストール
      run: pip install -r requirements.txt

    - name: データ取得スクリプトの実行
      run: python get_data.py

    - name: 更新されたデータを保存して公開
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add marine_data.json
        git diff --cached --quiet || (git commit -m "最新の気象データに更新" && git push)
